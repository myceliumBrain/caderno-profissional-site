# Publica o site no GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    # Os salvamentos do caderno (data/auth.json e data/caderno.json) não
    # precisam de deploy: o site lê esses arquivos direto pela API do GitHub.
    paths-ignore:
      - "data/**"
  # Permite rodar manualmente pela aba Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; execuções enfileiradas no meio são puladas.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Upload e deploy em jobs separados: no mesmo job, o deploy às vezes
  # procura o artefato antes de o GitHub registrá-lo ("No artifacts named
  # github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
